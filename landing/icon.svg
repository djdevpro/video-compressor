<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Trois triangles de lecture qui rétrécissent : la même vidéo, de plus en plus légère. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbb62"/>
      <stop offset="1" stop-color="#e8912c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#171717"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#363636" stroke-width="3"/>
  <polygon points="20,40 20,88 56,64" fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round" opacity="0.3"/>
  <polygon points="64,48.5 64,79.5 87,64" fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round" opacity="0.62"/>
  <polygon points="96,55 96,73 109,64" fill="url(#g)" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
</svg>
